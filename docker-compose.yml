version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nesty-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root@123}
      POSTGRES_DB: ${DB_NAME:-nesty}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nesty-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nesty-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-7777}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root@123}
      DB_NAME: ${DB_NAME:-nesty}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-10}
    ports:
      - "${PORT:-7777}:7777"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - nesty-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nesty-network:
    driver: bridge
